<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyperTube Stream Test</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 24px;
        background: #f7f7f7;
        color: #222;
      }
      .card {
        max-width: 900px;
        margin: 0 auto;
        padding: 16px;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }
      .header h1 {
        margin: 0;
      }
      label {
        display: block;
        margin: 0 0 8px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 12px;
        background: #fff;
      }
      button {
        padding: 8px 14px;
        border: 0;
        border-radius: 6px;
        background: #1d4ed8;
        color: #fff;
        cursor: pointer;
      }
      .suggestions {
        margin: 12px 0 16px;
        padding: 10px;
        border: 1px solid #e2e2e2;
        border-radius: 6px;
        background: #fafafa;
      }
      .suggestions-list {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px;
      }
      .suggestions-list li {
        margin: 0;
      }
      .suggestion-card {
        display: flex;
        gap: 10px;
        padding: 10px;
        border: 1px solid #d0d7e2;
        border-radius: 6px;
        background: #fff;
      }
      .suggestion-card img {
        width: 80px;
        height: 120px;
        object-fit: cover;
        border-radius: 4px;
        background: #e5e7eb;
      }
      .suggestion-meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        color: #374151;
      }
      .suggestion-title {
        font-weight: 600;
        font-size: 14px;
        color: #111827;
      }
      .suggestion-actions {
        margin-top: auto;
      }
      .suggestion-btn {
        width: 100%;
        text-align: center;
        padding: 6px 10px;
        border: 0;
        border-radius: 6px;
        background: #1d4ed8;
        color: #fff;
        cursor: pointer;
      }
      .suggestion-btn:hover {
        background: #1e40af;
      }
      .suggestions-footer {
        display: flex;
        justify-content: center;
        margin-top: 12px;
      }
      .suggestions-more-btn:disabled {
        cursor: wait;
        opacity: 0.7;
      }
      .detail-view {
        margin: 12px 0 16px;
        border-radius: 10px;
        overflow: hidden;
        background-size: cover;
        background-position: center;
        color: #fff;
      }
      .detail-overlay {
        padding: 16px;
        background: rgba(0, 0, 0, 0.65);
      }
      .detail-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .back-btn {
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.4);
        cursor: pointer;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 16px;
      }
      .detail-poster {
        width: 140px;
        height: 210px;
        object-fit: cover;
        border-radius: 6px;
        background: #111827;
      }
      .detail-info {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .detail-title {
        font-size: 20px;
        font-weight: 700;
      }
      .detail-meta,
      .detail-subtitles {
        font-size: 14px;
        color: #e5e7eb;
      }
      .detail-actions {
        margin-top: auto;
      }
      .detail-play {
        padding: 8px 14px;
        border: 0;
        border-radius: 6px;
        background: #22c55e;
        color: #0f172a;
        font-weight: 600;
        cursor: pointer;
      }
      video {
        width: 100%;
        margin-top: 16px;
        background: #000;
      }
      .note {
        margin-top: 10px;
        font-size: 14px;
        color: #555;
      }
      .now-playing {
        margin-top: 14px;
        padding: 12px;
        border: 1px solid #e2e2e2;
        border-radius: 8px;
        background: #fafafa;
      }
      .now-playing-title {
        margin-top: 6px;
        font-weight: 700;
        font-size: 16px;
        color: #111827;
      }
      .now-playing-meta {
        margin-top: 4px;
        font-size: 13px;
        color: #374151;
      }
      .now-playing-grid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px 12px;
      }
      .now-playing-item {
        font-size: 13px;
        color: #374151;
      }
      .now-playing-label {
        display: inline-block;
        min-width: 88px;
        font-weight: 600;
        color: #111827;
      }
      .now-playing-plot {
        margin-top: 8px;
        font-size: 13px;
        color: #374151;
      }
      .search {
        margin: 16px 0;
        padding: 12px;
        border: 1px solid #e2e2e2;
        border-radius: 8px;
        background: #fafafa;
      }
      .search-row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .search-row input {
        margin-bottom: 0;
      }
      .search-results {
        margin-top: 12px;
      }
      .search-grid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
      .search-card {
        display: flex;
        gap: 10px;
        padding: 10px;
        border: 1px solid #d0d7e2;
        border-radius: 6px;
        background: #fff;
      }
      .search-card img {
        width: 60px;
        height: 90px;
        object-fit: cover;
        border-radius: 4px;
        background: #e5e7eb;
      }
      .search-meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        color: #374151;
      }
      .search-title {
        font-weight: 600;
        color: #111827;
      }
      .popular {
        margin: 16px 0;
        padding: 12px;
        border: 1px solid #e2e2e2;
        border-radius: 8px;
        background: #fafafa;
      }
      .popular-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      .popular-filters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }
      .filter-field label {
        font-size: 13px;
      }
      .filter-field input,
      .filter-field select {
        margin-bottom: 0;
      }
      .popular-status {
        margin-top: 12px;
        font-size: 13px;
        color: #374151;
      }
      .popular-grid {
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h1>Stream Test</h1>
        <button id="suggestBtn">Show Suggestions</button>
      </div>
      <section class="search">
        <label for="searchInput">Search movies</label>
        <div class="search-row">
          <input
            id="searchInput"
            type="text"
            placeholder="Try: Inception"
          />
          <button id="searchBtn" type="button">Search</button>
        </div>
        <div class="search-results" id="searchResults" hidden>
          <strong>Results</strong>
          <div class="search-grid" id="searchResultsGrid"></div>
        </div>
      </section>
      <section class="popular">
        <div class="popular-header">
          <strong>Popular films</strong>
          <button id="popularApplyBtn" type="button">Apply filters</button>
        </div>
        <div class="popular-filters">
          <div class="filter-field">
            <label for="popularType">Type</label>
            <select id="popularType">
              <option value="">All</option>
              <option value="Action">Action</option>
              <option value="Adventure">Adventure</option>
              <option value="Animation">Animation</option>
              <option value="Comedy">Comedy</option>
              <option value="Crime">Crime</option>
              <option value="Documentary">Documentary</option>
              <option value="Drama">Drama</option>
              <option value="Fantasy">Fantasy</option>
              <option value="Horror">Horror</option>
              <option value="Romance">Romance</option>
              <option value="Sci-Fi">Sci-Fi</option>
              <option value="Thriller">Thriller</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="popularYear">Year</label>
            <input id="popularYear" type="number" min="1900" max="2100" placeholder="Any" />
          </div>
          <div class="filter-field">
            <label for="popularSort">Sort</label>
            <select id="popularSort">
              <option value="views">Views</option>
              <option value="rating">IMDb rating</option>
              <option value="year">Year</option>
              <option value="latest">Latest</option>
              <option value="likes">Likes</option>
              <option value="seeds">Seeds</option>
              <option value="title">Title</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="popularOrder">Order</label>
            <select id="popularOrder">
              <option value="desc">Descending</option>
              <option value="asc">Ascending</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="popularQuality">Quality</label>
            <select id="popularQuality">
              <option value="">All</option>
              <option value="720p">720p</option>
              <option value="1080p">1080p</option>
              <option value="2160p">2160p</option>
              <option value="3D">3D</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="popularMinimumRating">Minimum rating</label>
            <select id="popularMinimumRating">
              <option value="">Any</option>
              <option value="5">5+</option>
              <option value="6">6+</option>
              <option value="7">7+</option>
              <option value="8">8+</option>
              <option value="9">9+</option>
            </select>
          </div>
        </div>
        <div class="popular-status" id="popularStatus">Loading...</div>
        <div class="popular-grid" id="popularGrid"></div>
      </section>
      <div class="suggestions" id="suggestions" hidden>
        <strong>Suggestions</strong>
        <ul class="suggestions-list" id="suggestionsList"></ul>
        <div class="suggestions-footer" id="suggestionsFooter" hidden>
          <button class="suggestions-more-btn" id="loadMoreSuggestionsBtn" type="button">
            Show more
          </button>
        </div>
      </div>
      <section class="detail-view" id="suggestionDetail" hidden>
        <div class="detail-overlay">
          <div class="detail-top">
            <strong>Movie Details</strong>
            <button class="back-btn" id="backToSuggestions">Back to Suggestions</button>
          </div>
          <div class="detail-grid">
            <img class="detail-poster" id="detailPoster" alt="Movie cover" />
            <div class="detail-info">
              <div class="detail-title" id="detailTitle"></div>
              <div class="detail-meta" id="detailMeta"></div>
              <div class="detail-subtitles" id="detailSubtitles"></div>
              <div class="detail-actions">
                <button class="detail-play" id="detailPlay">Play</button>
              </div>
            </div>
          </div>
        </div>
      </section>
      <label for="movieId">Movie ID</label>
      <input id="movieId" type="text" value="76039" />
      <label for="quality">Quality (optional)</label>
      <input id="quality" type="text" placeholder="720p" />
      <label for="subtitleLang">Subtitles</label>
      <select id="subtitleLang">
        <option value="">Off</option>
      </select>
      <button id="loadBtn">Load Stream</button>
      <video id="player" controls preload="metadata" crossorigin="anonymous">
        <track
          id="subtitleTrack"
          kind="subtitles"
          label="English"
          srclang="en"
          default
        />
      </video>
      <section class="now-playing" id="nowPlaying" hidden>
        <strong>Now Playing</strong>
        <div class="now-playing-title" id="nowPlayingTitle"></div>
        <div class="now-playing-meta" id="nowPlayingMeta"></div>
        <div class="now-playing-grid">
          <div class="now-playing-item">
            <span class="now-playing-label">Director</span>
            <span id="nowPlayingDirector"></span>
          </div>
          <div class="now-playing-item">
            <span class="now-playing-label">Writer</span>
            <span id="nowPlayingWriter"></span>
          </div>
          <div class="now-playing-item">
            <span class="now-playing-label">Cast</span>
            <span id="nowPlayingCast"></span>
          </div>
          <div class="now-playing-item">
            <span class="now-playing-label">Production</span>
            <span id="nowPlayingProduction"></span>
          </div>
          <div class="now-playing-item">
            <span class="now-playing-label">Genre</span>
            <span id="nowPlayingGenre"></span>
          </div>
          <div class="now-playing-item">
            <span class="now-playing-label">Released</span>
            <span id="nowPlayingReleased"></span>
          </div>
          <div class="now-playing-item">
            <span class="now-playing-label">Language</span>
            <span id="nowPlayingLanguage"></span>
          </div>
          <div class="now-playing-item">
            <span class="now-playing-label">Country</span>
            <span id="nowPlayingCountry"></span>
          </div>
          <div class="now-playing-item">
            <span class="now-playing-label">Awards</span>
            <span id="nowPlayingAwards"></span>
          </div>
          <div class="now-playing-item">
            <span class="now-playing-label">Box Office</span>
            <span id="nowPlayingBoxOffice"></span>
          </div>
          <div class="now-playing-item">
            <span class="now-playing-label">Cache</span>
            <span id="nowPlayingCache"></span>
          </div>
        </div>
        <div class="now-playing-plot" id="nowPlayingPlot"></div>
      </section>
      <div class="note">
        Ensure the NestJS server is running at http://localhost:3000
      </div>
    </div>

    <script>
      const movieIdInput = document.getElementById('movieId');
      const qualityInput = document.getElementById('quality');
      const player = document.getElementById('player');
      const loadBtn = document.getElementById('loadBtn');
      const suggestBtn = document.getElementById('suggestBtn');
      const suggestions = document.getElementById('suggestions');
      const suggestionsList = document.getElementById('suggestionsList');
      const suggestionsFooter = document.getElementById('suggestionsFooter');
      const loadMoreSuggestionsBtn = document.getElementById('loadMoreSuggestionsBtn');
      const suggestionDetail = document.getElementById('suggestionDetail');
      const backToSuggestions = document.getElementById('backToSuggestions');
      const detailPoster = document.getElementById('detailPoster');
      const detailTitle = document.getElementById('detailTitle');
      const detailMeta = document.getElementById('detailMeta');
      const detailSubtitles = document.getElementById('detailSubtitles');
      const detailPlay = document.getElementById('detailPlay');
      const subtitleLang = document.getElementById('subtitleLang');
      const subtitleTrack = document.getElementById('subtitleTrack');
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');
      const searchResults = document.getElementById('searchResults');
      const searchResultsGrid = document.getElementById('searchResultsGrid');
      const popularApplyBtn = document.getElementById('popularApplyBtn');
      const popularType = document.getElementById('popularType');
      const popularYear = document.getElementById('popularYear');
      const popularSort = document.getElementById('popularSort');
      const popularOrder = document.getElementById('popularOrder');
      const popularQuality = document.getElementById('popularQuality');
      const popularMinimumRating = document.getElementById('popularMinimumRating');
      const popularStatus = document.getElementById('popularStatus');
      const popularGrid = document.getElementById('popularGrid');
      const nowPlaying = document.getElementById('nowPlaying');
      const nowPlayingTitle = document.getElementById('nowPlayingTitle');
      const nowPlayingMeta = document.getElementById('nowPlayingMeta');
      const nowPlayingDirector = document.getElementById('nowPlayingDirector');
      const nowPlayingWriter = document.getElementById('nowPlayingWriter');
      const nowPlayingCast = document.getElementById('nowPlayingCast');
      const nowPlayingProduction = document.getElementById('nowPlayingProduction');
      const nowPlayingGenre = document.getElementById('nowPlayingGenre');
      const nowPlayingReleased = document.getElementById('nowPlayingReleased');
      const nowPlayingLanguage = document.getElementById('nowPlayingLanguage');
      const nowPlayingCountry = document.getElementById('nowPlayingCountry');
      const nowPlayingAwards = document.getElementById('nowPlayingAwards');
      const nowPlayingBoxOffice = document.getElementById('nowPlayingBoxOffice');
      const nowPlayingCache = document.getElementById('nowPlayingCache');
      const nowPlayingPlot = document.getElementById('nowPlayingPlot');
      const suggestionPageSize = 6;
      let suggestionMovies = [];
      let suggestionCursor = 0;
      let cacheStatusTimer = null;

      function buildUrl() {
        const movieId = movieIdInput.value.trim();
        const quality = qualityInput.value.trim();
        const params = quality ? `?quality=${encodeURIComponent(quality)}` : '';
        return `http://localhost:3000/movies/${encodeURIComponent(movieId)}/stream${params}`;
      }

      function buildSubtitleUrl(movieId, lang) {
        if (!lang) {
          return '';
        }
        const quality = qualityInput.value.trim();
        const params = new URLSearchParams();
        if (quality) {
          params.set('quality', quality);
        }
        params.set('lang', lang);
        return `http://localhost:3000/movies/${encodeURIComponent(movieId)}/subtitles?${params.toString()}`;
      }

      function updateSubtitleTrack(movieId) {
        const lang = subtitleLang.value;
        if (!movieId || !lang) {
          subtitleTrack.src = '';
          subtitleTrack.mode = 'disabled';
          return;
        }
        subtitleTrack.src = buildSubtitleUrl(movieId, lang);
        subtitleTrack.mode = 'showing';
      }

      function getMovieImage(...movies) {
        for (const movie of movies) {
          if (!movie) {
            continue;
          }
          const image = movie.image || movie.cover_image || movie.backdrop;
          if (image) {
            return image;
          }
        }
        return '';
      }

      function mergeMovieDetail(detail, fallback) {
        const merged = {
          ...(fallback || {}),
          ...(detail || {}),
        };
        const image = getMovieImage(detail, fallback);
        if (image) {
          merged.image = image;
        }
        merged.cover_image =
          detail?.cover_image ||
          fallback?.cover_image ||
          detail?.backdrop ||
          fallback?.backdrop ||
          image ||
          null;
        merged.backdrop =
          detail?.backdrop ||
          fallback?.backdrop ||
          detail?.cover_image ||
          fallback?.cover_image ||
          image ||
          null;
        return merged;
      }

      loadBtn.addEventListener('click', () => {
        playMovie(movieIdInput.value.trim());
      });

      function playMovie(movieId) {
        if (!movieId) {
          return;
        }
        movieIdInput.value = String(movieId);
        loadSubtitleOptions(movieId).then(() => updateSubtitleTrack(movieId));
        loadNowPlaying(movieId);
        player.src = buildUrl();
        player.load();
        // Load cache status AFTER requesting the stream so the torrent is in the system
        setTimeout(() => {
          loadCacheStatus(movieId);
        }, 500);
        player.play().catch(() => undefined);
      }

      function showSuggestionDetail(detail) {
        suggestionDetail.hidden = false;
        suggestions.hidden = true;

        const poster = getMovieImage(detail) || 'https://via.placeholder.com/140x210?text=No+Image';
        const backdropImage = detail?.backdrop || detail?.cover_image || poster;
        const backdrop = backdropImage
          ? `linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url("${backdropImage}")`
          : 'linear-gradient(180deg, #111827, #1f2937)';
        suggestionDetail.style.backgroundImage = backdrop;

        detailPoster.src = poster;
        detailTitle.textContent = detail?.name || 'Unknown Title';
        const imdb = detail?.imdb_rating ?? 'N/A';
        const year = detail?.year ?? 'N/A';
        const length = detail?.length ? `${detail.length} min` : 'N/A';
        const id = detail?.id ?? 'N/A';
        detailMeta.textContent = `ID: ${id} | IMDb: ${imdb} | Year: ${year} | Length: ${length}`;

        const subtitles = Array.isArray(detail?.subtitles) && detail.subtitles.length
          ? detail.subtitles.join(', ')
          : 'None';
        detailSubtitles.textContent = `Subtitles: ${subtitles}`;


        detailPlay.onclick = () => playMovie(detail?.id);
        loadSubtitleOptions(detail?.id);
      }

      function hideSuggestionDetail() {
        suggestionDetail.hidden = true;
        suggestions.hidden = false;
      }

      function updateSuggestionsFooter(isLoading = false) {
        const hasMore = suggestionCursor < suggestionMovies.length;
        suggestionsFooter.hidden = !isLoading && !hasMore;
        loadMoreSuggestionsBtn.disabled = isLoading || !hasMore;
        loadMoreSuggestionsBtn.textContent = isLoading ? 'Loading...' : 'Show more';
      }

      async function appendSuggestionBatch() {
        const selected = suggestionMovies.slice(
          suggestionCursor,
          suggestionCursor + suggestionPageSize,
        );
        if (!selected.length) {
          updateSuggestionsFooter();
          return;
        }

        suggestionCursor += selected.length;
        updateSuggestionsFooter(true);
        const detailResponses = await Promise.all(
          selected.map((movie) =>
            fetch(`http://localhost:3000/movies/${encodeURIComponent(movie.id)}`)
              .then((detailResponse) =>
                detailResponse.ok ? detailResponse.json() : null,
              )
              .catch(() => null),
          ),
        );

        detailResponses.forEach((detail, index) => {
          const baseMovie = selected[index];
          const displayMovie = mergeMovieDetail(detail, baseMovie);
          const item = document.createElement('li');
          const card = document.createElement('div');
          card.className = 'suggestion-card';

          const img = document.createElement('img');
          img.alt = displayMovie?.name || 'Movie cover';
          img.src = getMovieImage(displayMovie) || 'https://via.placeholder.com/80x120?text=No+Image';

          const meta = document.createElement('div');
          meta.className = 'suggestion-meta';

          const title = document.createElement('div');
          title.className = 'suggestion-title';
          title.textContent = displayMovie?.name || 'Unknown Title';

          const info = document.createElement('div');
          const imdb = formatRatingValue(displayMovie?.imdb_rating ?? displayMovie?.rating);
          const year = formatYearValue(displayMovie?.year);
          info.textContent = `ID: ${displayMovie?.id || baseMovie.id} | IMDb: ${imdb} | Year: ${year}`;

          const sourceLine = document.createElement('div');
          sourceLine.textContent = `Source: ${formatSources(displayMovie?.sources || baseMovie.sources, baseMovie.provider)}`;

          const actions = document.createElement('div');
          actions.className = 'suggestion-actions';
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'suggestion-btn';
          button.textContent = 'Open';
          button.addEventListener('click', () => {
            showSuggestionDetail(displayMovie);
          });
          actions.appendChild(button);

          meta.appendChild(title);
          meta.appendChild(info);
          meta.appendChild(actions);
          meta.appendChild(sourceLine);

          card.appendChild(img);
          card.appendChild(meta);
          item.appendChild(card);
          suggestionsList.appendChild(item);
        });

        updateSuggestionsFooter();
      }

      async function loadSuggestions() {
        suggestionsList.innerHTML = '';
        suggestions.hidden = false;
        suggestionDetail.hidden = true;
        suggestionMovies = [];
        suggestionCursor = 0;
        updateSuggestionsFooter(true);

        const response = await fetch('http://localhost:3000/movies');
        if (!response.ok) {
          suggestionsList.innerHTML = '<li>Failed to load suggestions.</li>';
          suggestionMovies = [];
          suggestionCursor = 0;
          updateSuggestionsFooter();
          return;
        }

        const movies = await response.json();
        suggestionMovies = Array.isArray(movies) ? movies : [];
        suggestionCursor = 0;

        if (!suggestionMovies.length) {
          suggestionsList.innerHTML = '<li>No suggestions found.</li>';
          updateSuggestionsFooter();
          return;
        }

        await appendSuggestionBatch();
      }

      suggestBtn.addEventListener('click', () => {
        loadSuggestions().catch(() => {
          suggestions.hidden = false;
          suggestionsList.innerHTML = '<li>Failed to load suggestions.</li>';
          suggestionMovies = [];
          suggestionCursor = 0;
          updateSuggestionsFooter();
        });
      });

      loadMoreSuggestionsBtn.addEventListener('click', () => {
        appendSuggestionBatch().catch(() => {
          updateSuggestionsFooter();
        });
      });

      function formatValue(value) {
        if (Array.isArray(value)) {
          return value.filter(Boolean).join(', ') || 'N/A';
        }
        if (value === null || value === undefined || value === '') {
          return 'N/A';
        }
        return String(value);
      }

      function formatYearValue(value) {
        if (typeof value === 'number') {
          return value > 0 ? String(value) : 'N/A';
        }
        return formatValue(value);
      }

      function formatRatingValue(value) {
        if (typeof value === 'number') {
          return value > 0 ? value.toFixed(1) : 'N/A';
        }
        return formatValue(value);
      }

      function formatSources(sources, fallback) {
        if (Array.isArray(sources) && sources.length) {
          return sources.map((source) => String(source).toUpperCase()).join(', ');
        }
        if (fallback) {
          return String(fallback).toUpperCase();
        }
        return 'N/A';
      }

      function formatNumberValue(value) {
        if (typeof value !== 'number' || !Number.isFinite(value)) {
          return 'N/A';
        }
        return new Intl.NumberFormat('en').format(value);
      }

      function buildPopularUrl() {
        const params = new URLSearchParams();
        const type = popularType.value;
        const year = popularYear.value.trim();
        const sortBy = popularSort.value;
        const orderBy = popularOrder.value;
        const quality = popularQuality.value;
        const minimumRating = popularMinimumRating.value;

        if (type) {
          params.set('type', type);
        }
        if (year) {
          params.set('year', year);
        }
        if (sortBy) {
          params.set('sort_by', sortBy);
        }
        if (orderBy) {
          params.set('order_by', orderBy);
        }
        if (quality) {
          params.set('quality', quality);
        }
        if (minimumRating) {
          params.set('minimum_rating', minimumRating);
        }
        params.set('limit', '12');

        return `http://localhost:3000/movies/popular?${params.toString()}`;
      }

      async function openMovieDetail(movie) {
        if (!movie?.id) {
          return;
        }
        const response = await fetch(
          `http://localhost:3000/movies/${encodeURIComponent(movie.id)}`,
        );
        const detail = response.ok ? await response.json() : null;
        showSuggestionDetail(mergeMovieDetail(detail, movie));
        suggestionDetail.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function renderPopularCard(movie) {
        const card = document.createElement('div');
        card.className = 'search-card';

        const img = document.createElement('img');
        img.alt = movie?.name || 'Movie cover';
        img.src = getMovieImage(movie) || 'https://via.placeholder.com/60x90?text=No+Image';

        const meta = document.createElement('div');
        meta.className = 'search-meta';

        const title = document.createElement('div');
        title.className = 'search-title';
        title.textContent = movie?.name || 'Unknown Title';

        const year = formatYearValue(movie?.year);
        const imdb = formatRatingValue(movie?.imdb_rating ?? movie?.rating);
        const info = document.createElement('div');
        info.textContent = `Year: ${year} | IMDb: ${imdb}`;

        const stats = document.createElement('div');
        stats.textContent = `Views: ${formatNumberValue(movie?.views)} | Likes: ${formatNumberValue(movie?.likes)}`;

        const genres = document.createElement('div');
        genres.textContent = `Type: ${formatValue(movie?.genres)}`;

        const actions = document.createElement('div');
        const openBtn = document.createElement('button');
        openBtn.type = 'button';
        openBtn.className = 'suggestion-btn';
        openBtn.textContent = 'Open';
        openBtn.addEventListener('click', () => {
          openMovieDetail(movie).catch(() => undefined);
        });
        actions.appendChild(openBtn);

        meta.appendChild(title);
        meta.appendChild(info);
        meta.appendChild(stats);
        meta.appendChild(genres);
        meta.appendChild(actions);

        card.appendChild(img);
        card.appendChild(meta);
        return card;
      }

      async function loadPopularMovies() {
        popularApplyBtn.disabled = true;
        popularStatus.hidden = false;
        popularStatus.textContent = 'Loading...';
        popularGrid.innerHTML = '';

        const response = await fetch(buildPopularUrl());
        if (!response.ok) {
          popularStatus.textContent = 'Failed to load popular films.';
          popularApplyBtn.disabled = false;
          return;
        }

        const movies = await response.json();
        if (!Array.isArray(movies) || movies.length === 0) {
          popularStatus.textContent = 'No films found.';
          popularApplyBtn.disabled = false;
          return;
        }

        popularStatus.hidden = true;
        movies.forEach((movie) => {
          popularGrid.appendChild(renderPopularCard(movie));
        });
        popularApplyBtn.disabled = false;
      }

      function updateNowPlaying(detail) {
        if (!detail) {
          nowPlaying.hidden = true;
          return;
        }

        nowPlaying.hidden = false;
        nowPlayingTitle.textContent = detail?.name || 'Unknown Title';
        const imdb = formatValue(detail?.imdb_rating);
        const votes = formatValue(detail?.imdb_votes);
        const year = formatValue(detail?.year);
        const length = detail?.length ? `${detail.length} min` : 'N/A';
        const rated = formatValue(detail?.rated);
        nowPlayingMeta.textContent = `IMDb: ${imdb} (${votes}) | Year: ${year} | Length: ${length} | Rated: ${rated}`;

        nowPlayingDirector.textContent = formatValue(detail?.director);
        nowPlayingWriter.textContent = formatValue(detail?.writer);
        nowPlayingCast.textContent = formatValue(detail?.cast);
        nowPlayingProduction.textContent = formatValue(detail?.production);
        nowPlayingGenre.textContent = formatValue(detail?.genre);
        nowPlayingReleased.textContent = formatValue(detail?.released);
        nowPlayingLanguage.textContent = formatValue(detail?.language);
        nowPlayingCountry.textContent = formatValue(detail?.country);
        nowPlayingAwards.textContent = formatValue(detail?.awards);
        nowPlayingBoxOffice.textContent = formatValue(detail?.box_office);
        const plot = formatValue(detail?.plot);
        nowPlayingPlot.textContent = plot === 'N/A' ? '' : `Plot: ${plot}`;

      }

      function formatBytes(value) {
        if (typeof value !== 'number' || !Number.isFinite(value)) {
          return 'N/A';
        }
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let size = value;
        let unitIndex = 0;
        while (size >= 1024 && unitIndex < units.length - 1) {
          size /= 1024;
          unitIndex += 1;
        }
        const precision = size >= 10 || unitIndex === 0 ? 0 : 1;
        return `${size.toFixed(precision)} ${units[unitIndex]}`;
      }

      function updateCacheStatus(status) {
        if (!status) {
          nowPlayingCache.textContent = 'Unknown';
          return;
        }

        if (status.cached) {
          const sizeLabel = formatBytes(status.size);
          const qualityLabel = status.quality ? ` (${status.quality})` : '';
          nowPlayingCache.textContent =
            sizeLabel === 'N/A'
              ? `Cached${qualityLabel}`
              : `Cached${qualityLabel} - ${sizeLabel}`;
          return;
        }

        if (status.downloading) {
          const percent = Number.isFinite(status.progress)
            ? Math.round(status.progress * 100)
            : null;
          const downloadedLabel = formatBytes(status.downloaded);
          const sizeLabel = formatBytes(status.size);
          const sizeInfo =
            downloadedLabel !== 'N/A' && sizeLabel !== 'N/A'
              ? ` (${downloadedLabel} / ${sizeLabel})`
              : '';
          const percentLabel = percent === null ? 'Downloading' : `Downloading ${percent}%`;
          nowPlayingCache.textContent = `${percentLabel}${sizeInfo}`;
          return;
        }

        nowPlayingCache.textContent = 'Not cached';
      }

      async function loadCacheStatus(movieId) {
        if (!movieId) {
          nowPlayingCache.textContent = 'N/A';
          return;
        }

        if (cacheStatusTimer) {
          clearInterval(cacheStatusTimer);
          cacheStatusTimer = null;
        }

        const quality = qualityInput.value.trim();
        const params = quality ? `?quality=${encodeURIComponent(quality)}` : '';

        try {
          const response = await fetch(
            `http://localhost:3000/movies/${encodeURIComponent(movieId)}/cache${params}`,
          );
          if (!response.ok) {
            nowPlayingCache.textContent = 'Unknown';
            return;
          }
          const status = await response.json();
          updateCacheStatus(status);

          if (status?.downloading) {
            cacheStatusTimer = setInterval(() => {
              loadCacheStatus(movieId).catch(() => {
                if (cacheStatusTimer) {
                  clearInterval(cacheStatusTimer);
                  cacheStatusTimer = null;
                }
                nowPlayingCache.textContent = 'Unknown';
              });
            }, 5000);
          }
        } catch (error) {
          nowPlayingCache.textContent = 'Unknown';
        }
      }

      async function loadNowPlaying(movieId) {
        if (!movieId) {
          nowPlaying.hidden = true;
          return;
        }

        try {
          const response = await fetch(
            `http://localhost:3000/movies/${encodeURIComponent(movieId)}`,
          );
          if (!response.ok) {
            nowPlaying.hidden = true;
            return;
          }
          const detail = await response.json();
          updateNowPlaying(detail);
        } catch (error) {
          nowPlaying.hidden = true;
        }
      }

      async function searchMovies() {
        const query = searchInput.value.trim();
        if (!query) {
          searchResults.hidden = true;
          searchResultsGrid.innerHTML = '';
          return;
        }

        searchResults.hidden = false;
        searchResultsGrid.innerHTML = '<div>Searching...</div>';

        const response = await fetch(
          `http://localhost:3000/movies/search?name=${encodeURIComponent(query)}`,
        );
        if (!response.ok) {
          searchResultsGrid.innerHTML = '<div>Search failed.</div>';
          return;
        }

        const movies = await response.json();
        if (!Array.isArray(movies) || movies.length === 0) {
          searchResultsGrid.innerHTML = '<div>No matches found.</div>';
          return;
        }

        searchResultsGrid.innerHTML = '';
        movies.forEach((baseMovie) => {
          const card = document.createElement('div');
          card.className = 'search-card';

          const img = document.createElement('img');
          img.alt = baseMovie?.name || 'Movie cover';
          img.src = getMovieImage(baseMovie) || 'https://via.placeholder.com/60x90?text=No+Image';

          const meta = document.createElement('div');
          meta.className = 'search-meta';

          const title = document.createElement('div');
          title.className = 'search-title';
          title.textContent = baseMovie?.name || 'Unknown Title';

          const year = formatYearValue(baseMovie?.year);
          const imdb = formatRatingValue(baseMovie?.imdb_rating ?? baseMovie?.rating);
          const info = document.createElement('div');
          info.textContent = `Year: ${year} | IMDb: ${imdb}`;

          const sourceLine = document.createElement('div');
          sourceLine.textContent = `Source: ${formatSources(baseMovie?.sources, baseMovie?.provider)}`;

          const actions = document.createElement('div');
          const playBtn = document.createElement('button');
          playBtn.type = 'button';
          playBtn.className = 'suggestion-btn';
          playBtn.textContent = 'Play';
          playBtn.addEventListener('click', () => {
            if (baseMovie?.provider === 'yts') {
              playMovie(baseMovie.id);
              return;
            }

            if (!baseMovie?.provider || !baseMovie?.provider_id) {
              return;
            }

            const provider = encodeURIComponent(baseMovie.provider);
            const providerId = encodeURIComponent(baseMovie.provider_id);
            fetch(`http://localhost:3000/movies/provider/${provider}/${providerId}/resolve`)
              .then((resolveResponse) =>
                resolveResponse.ok ? resolveResponse.json() : null,
              )
              .then((resolved) => {
                if (resolved?.yts_id) {
                  playMovie(resolved.yts_id);
                  return;
                }
                return fetch(
                  `http://localhost:3000/movies/provider/${provider}/${providerId}`,
                )
                  .then((detailResponse) =>
                    detailResponse.ok ? detailResponse.json() : null,
                  )
                  .then((detail) => {
                    if (!detail) {
                      return;
                    }
                    showSuggestionDetail(detail);
                    if (detail?.provider === 'yts' && detail?.id) {
                      playMovie(detail.id);
                    }
                  });
              })
              .catch(() => undefined);
          });
          actions.appendChild(playBtn);

          meta.appendChild(title);
          meta.appendChild(info);
          meta.appendChild(sourceLine);
          meta.appendChild(actions);

          card.appendChild(img);
          card.appendChild(meta);
          searchResultsGrid.appendChild(card);
        });
      }

      searchBtn.addEventListener('click', () => {
        searchMovies().catch(() => {
          searchResults.hidden = false;
          searchResultsGrid.innerHTML = '<div>Search failed.</div>';
        });
      });

      searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          searchMovies().catch(() => {
            searchResults.hidden = false;
            searchResultsGrid.innerHTML = '<div>Search failed.</div>';
          });
        }
      });

      popularApplyBtn.addEventListener('click', () => {
        loadPopularMovies().catch(() => {
          popularStatus.hidden = false;
          popularStatus.textContent = 'Failed to load popular films.';
          popularApplyBtn.disabled = false;
        });
      });

      subtitleLang.addEventListener('change', () => {
        updateSubtitleTrack(movieIdInput.value.trim());
      });

      backToSuggestions.addEventListener('click', () => {
        hideSuggestionDetail();
      });

      async function loadSubtitleOptions(movieId) {
        subtitleLang.innerHTML = '<option value="">Off</option>';
        if (!movieId) {
          return;
        }

        const quality = qualityInput.value.trim();
        const params = quality ? `?quality=${encodeURIComponent(quality)}` : '';
        const response = await fetch(
          `http://localhost:3000/movies/${encodeURIComponent(movieId)}/subtitles/list${params}`,
        );
        if (!response.ok) {
          return;
        }
        const items = await response.json();
        items.forEach((item) => {
          const option = document.createElement('option');
          option.value = item.code;
          option.textContent = `${item.label} (${item.code})`;
          subtitleLang.appendChild(option);
        });

        const english = items.find((item) => item.code === 'eng' || item.code === 'en');
        if (english) {
          subtitleLang.value = english.code;
        } else if (items.length) {
          subtitleLang.value = items[0].code;
        }
      }

      player.src = buildUrl();
      loadSubtitleOptions(movieIdInput.value.trim()).then(() => {
        updateSubtitleTrack(movieIdInput.value.trim());
      });
      loadNowPlaying(movieIdInput.value.trim());
      loadCacheStatus(movieIdInput.value.trim());
      loadPopularMovies().catch(() => {
        popularStatus.hidden = false;
        popularStatus.textContent = 'Failed to load popular films.';
        popularApplyBtn.disabled = false;
      });
    </script>
  </body>
</html>
